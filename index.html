<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <title>Crafter Login</title>
</head>

<body>
    <!-- How do I add a realtime clock to my css html website -->
    <div class="clock-container">
        <div id="clock"></div>
    </div>
    <!-- I want to add audio to my html css file -->
    <audio id="myAudio">
        <source src="./resources/tnt.mp3" type="audio/mpeg">
    </audio>
    <!-- I need to display a clickable red box that when clicked plays an animation of going down from the top middle of the screen to the middle -->
    <a href="#animate" class="box" id="animate">
        <div class="outline"></div>
        <div class="red"></div>
        <div class="stripe">TNT</div>
    </a>
    <div class="postAnimBackground"></div>
    <div class="login-box" , id="login-form">
        <div class="pickaxe-carrier">
            <div class="pickaxe">
                <div class="handle"></div>
                <div class="head"></div>
                <div class="pickL"></div>
                <div class="pickR"></div>
            </div>
        </div>
        <form>
            <div class="title">Minecraft Login</div>
            <div class="form-group">
                <input type="text" , id="username" , placeholder="Username" />
            </div>
            <div class="form-group">
                <input type="password" , id="password" , placeholder="Password" />
            </div>
            <div class="form-group">
                <button type="submit" , id="login-but" , onclick="login()">Login</button>
                <p id="error" style="color: red;"></p>
            </div>
            <div class="form-option">
                <a href="" class="forgot-password">Forgot Password?</a>
                <a href="" class="sign-up">Sign Up</a>
            </div>
        </form>
    </div>
    <!-- I want to add audio to my html css file -->
    <script>
        //         Using JavaScript, modify the login screen so that when a user attempts to log in and clicks the
        // login button, their username and password are stored in an array in the background. Then,
        // print all elements of this array to the console.
        let logins = [];

        // I dont want the form to be hidden when you press h while inputting username and password
        document.addEventListener("keydown", function (event) {
            if ((event.key === "h" || event.key === "H") &&
                document.activeElement !== document.getElementById("username") &&
                document.activeElement !== document.getElementById("password")) {

                const loginForm = document.getElementById("login-form");
                if (loginForm) {
                    event.preventDefault();
                    loginForm.style.visibility = loginForm.style.visibility === "hidden" ? "visible" : "hidden";
                }
            }
        });
        document.getElementById('animate').addEventListener('click', function (event) {
            var audio = document.getElementById('myAudio');
            audio.play();
        });
        document.getElementById('login-but').addEventListener('click', function (event) {
            event.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            logins.push({ username, password });

            console.log("Logins:", logins);
        });
        //How do I add a realtime clock to my css html website
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById("clock").textContent = timeString;
        }
        setInterval(updateClock, 1000);

        updateClock();

        // Use JavaScript to implement the login functionality and redirect.
        // • Set the default login credentials to:
        // o Username: admin
        // o Password: admin
        // • When a user logs in using these credentials, redirect them to the new page
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            if (username === "admin" && password === "admin") {
                window.location.href = "table.html"; // Redirect to another page
            } else {
                document.getElementById("error").textContent = "Invalid credentials";
            }
        }
    </script>
</body>

</html>
