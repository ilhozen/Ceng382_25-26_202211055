<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./table-style.css" />
    <title>Crafter Table</title>
</head>

<!-- This page should include:
-A class information input form with the following fields: 
1- Class Name 
2- Number of People 
3- Description 
4- A class table that displays the entered class information, showing the above details 
for each entry.
Dynamic Table Update:
- Implement functionality so that when data is entered and submitted via the form, the class 
table updates dynamically without reloading the page.
The input form should be on the left while the table is on the right.
Use js css html  -->

<body>
    <div class="container">
        <div class="form-container">
            <h2>Add Class Information</h2>
            <form id="classForm">
                <label for="className">Class Name:</label>
                <input type="text" id="className" required><br><br>

                <label for="numPeople">Number of People:</label>
                <input type="number" id="numPeople" required><br><br>

                <label for="description">Description:</label><br>
                <textarea id="description" rows="4" required></textarea><br><br>

                <button type="submit">Add Class</button>
            </form>
        </div>

        <div class="table-container">
            <h2>Class Table</h2>
            <table>
                <thead>
                    <tr>
                        <th>Class Name</th>
                        <th>Number of People</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="classTableBody">
                    <!-- Dynamic content goes here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById("classForm").addEventListener("submit", function (event) {
            event.preventDefault();

            let className = document.getElementById("className").value;
            let numPeople = document.getElementById("numPeople").value;
            let description = document.getElementById("description").value;

            let tableBody = document.getElementById("classTableBody");
            let newRow = tableBody.insertRow();

            let cell1 = newRow.insertCell(0);
            let cell2 = newRow.insertCell(1);
            let cell3 = newRow.insertCell(2);
            let cell4 = newRow.insertCell(3);

            cell1.textContent = className;
            cell2.textContent = numPeople;
            cell3.textContent = description;

            //I want a red X to show up next to a row when I hover over it when pressed deletes the row in js
            let deleteBtn = document.createElement("span");
            deleteBtn.textContent = "X";
            deleteBtn.classList.add("delete-btn");

            deleteBtn.addEventListener("click", function () {
                tableBody.removeChild(newRow);
            });

            newRow.addEventListener("mouseenter", function () {
                newRow.style.backgroundColor = "#000000";
                deleteBtn.style.display = "inline";
            });
            newRow.addEventListener("mouseleave", function () {
                newRow.style.backgroundColor = "";
                deleteBtn.style.display = "none";
            });

            //I want it when I double click on a row it gives me more info on it
            newRow.addEventListener("dblclick", function () {
                alert("Class Name: " + className + "\nNumber of People: " + numPeople + "\nDescription: " + description);
            });

            cell4.appendChild(deleteBtn);
            document.getElementById("classForm").reset();
        });
    </script>
</body>

</html>
